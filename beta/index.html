<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dedemin Beta">
<meta name="theme-color" content="#10302a">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="icon" type="image/png" href="../icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Dedemin Lokantası</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&family=Caveat:wght@600&display=swap">
<style>
/* Layout: one-column phone game. Bursa palette: Yeşil Türbe tile green ground, Bakırcılar copper accent, cream tiles.
   Top: shopfront scene + next repair; middle: customers; bottom: 6x6 merge board and producers. */
:root{
  --ground:#10302a;
  --panel:#18423a;
  --panel2:#215248;
  --tile:#f3ead6;
  --copper:#d0793c;
  --turq:#45c1a8;
  --ink:#1d2a26;
  --cream:#f6f0e3;
  --muted:#a6c4bb;
  --wheat:#f2d48a; --milk:#dfeaf3; --garden:#f4c4ae;
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  --hand:"Caveat","Segoe Print","Comic Sans MS",cursive;
  color-scheme:dark;
}
html,body{min-height:100%}
body{background:var(--ground);color:var(--cream);font-family:var(--body);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font-family:inherit}
button:focus-visible{outline:3px solid var(--turq);outline-offset:2px}
.app{box-sizing:border-box;max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:10px;
  padding-block:10px 22px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));user-select:none;-webkit-user-select:none}
@media (min-width:380px){.app{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}

/* top bar */
.top{display:flex;align-items:center;gap:8px}
.top h1{font:700 1.3rem/1 var(--display);margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{background:var(--panel);border-radius:999px;padding:6px 10px;font:700 .9rem var(--display);display:flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip small{font:600 .68rem var(--body);color:var(--muted)}
.coin{width:14px;height:14px;border-radius:50%;background:var(--copper);box-shadow:inset 0 0 0 2px #f0a66f;display:inline-block}
.bolt{color:#ffd166}

/* scene */
.scene{background:var(--panel);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.scene svg{display:block;width:100%;height:auto;max-width:100%}
.scenebox{position:relative}
.scenebox .photo{display:block;width:100%;aspect-ratio:16/9;height:auto;object-fit:cover;transition:filter .8s}
.scenebox .over{position:absolute;inset:0;width:100%;height:100%}
.scenebox .over *{transition:opacity .8s}
.repair{display:flex;align-items:center;gap:10px;padding:10px 12px}
.repair .txt{flex:1;min-width:0}
.repair .lbl{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800}
.repair .name{font:600 1rem var(--display)}
.bar{height:6px;background:var(--ground);border-radius:4px;margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--copper);border-radius:4px;transition:width .3s}
.btn{border:0;border-radius:12px;padding:9px 14px;font:700 .95rem var(--display);cursor:pointer;background:var(--copper);color:var(--ink)}
.btn:disabled{background:var(--panel2);color:var(--muted);cursor:default}
.btn.ghost{background:var(--panel2);color:var(--cream)}

/* speech */
.speech{background:var(--tile);color:var(--ink);border-radius:14px;padding:9px 12px;font-size:.9rem;line-height:1.35;position:relative;min-height:2.7em}
.speech b{font-family:var(--display);font-weight:600}
.speech:after{content:"";position:absolute;left:28px;bottom:-7px;border:7px solid transparent;border-top-color:var(--tile);border-bottom:0}

/* orders */
.orders{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.order{background:var(--panel);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0;border:2px solid transparent;transition:transform .25s,opacity .25s}
.order.ready{border-color:var(--turq)}
.order.leaving{opacity:0;transform:translateY(-8px)}
.who{display:flex;align-items:center;gap:6px;min-width:0}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:700 .72rem var(--display);color:var(--ink);flex:none}
.who .n{font:600 .82rem var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.needs{display:flex;gap:4px;flex-wrap:wrap}
.need{position:relative;width:36px;height:36px;border-radius:9px;display:grid;place-items:center}
.need.ok:after{content:"✓";position:absolute;right:-4px;bottom:-4px;width:15px;height:15px;border-radius:50%;background:var(--turq);color:var(--ink);font:800 10px/15px var(--body);text-align:center}
.order .btn{padding:6px 8px;font-size:.85rem;display:flex;justify-content:center;gap:4px;align-items:center}

/* board */
.boardwrap{background:var(--panel);border-radius:16px;padding:8px}
.board{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;touch-action:none}
.cell{aspect-ratio:1;border-radius:8px;background:rgba(243,234,214,.13);box-shadow:inset 0 0 0 1px rgba(243,234,214,.12);display:grid;place-items:center;position:relative;min-width:0}
.cell.target{background:rgba(69,193,168,.35)}
.item{width:92%;height:92%;border-radius:10px;display:grid;place-items:center;font-size:clamp(18px,5.8vw,26px);position:relative;cursor:grab;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.item .lv{position:absolute;right:3px;bottom:2px;font:700 .62rem var(--display);color:var(--ink);opacity:.7}
.item.sel{outline:3px solid var(--turq);outline-offset:1px}
.item.dragging{opacity:.25}
.item.pop{animation:pop .35s ease-out}
.item.spawn{animation:spawn .3s ease-out}
.item.hint{animation:wig 1s ease-in-out infinite}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes spawn{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.c-f{background:#f7ebcf} .c-s{background:#edf2f4} .c-b{background:#f8e4da} .c-k{background:#f7ebcf} .c-p{background:#e9f1dc} .c-m{background:#f8e0d8}
.dragghost{position:fixed;left:0;top:0;pointer-events:none;z-index:50;width:56px;height:56px;border-radius:12px;display:grid;place-items:center;font-size:30px;box-shadow:0 8px 18px rgba(0,0,0,.45)}
.info{font-size:.82rem;color:var(--muted);min-height:1.3em;padding:6px 2px 0;text-align:center}
.info b{color:var(--cream)}

.under{display:flex;align-items:center;gap:8px;padding-top:7px}
.under .info{flex:1;min-width:0;text-align:left;padding:0 2px}
.sell{width:54px;height:44px;flex:none;border:2px dashed var(--panel2);border-radius:10px;display:grid;place-items:center;font:600 .78rem var(--display);color:var(--muted)}
.sell.target{border-color:var(--copper);color:var(--cream);background:rgba(208,121,60,.2)}
.item svg,.dragghost svg,.need svg{width:86%;height:86%;display:block;pointer-events:none}
.item img,.dragghost img,.need img{width:90%;height:90%;object-fit:contain;display:block;pointer-events:none;-webkit-user-drag:none;filter:drop-shadow(0 1.5px 1px rgba(0,0,0,.18))}
.item.gen{background:linear-gradient(#f6dcc0,#e0a070);box-shadow:0 2px 0 rgba(0,0,0,.3),inset 0 0 0 2px #f6d2ae;cursor:pointer}
.item.gen .lv{display:none}
.item.bump{animation:pop .25s ease-out}
.dragghost.gen-g{background:linear-gradient(#efc59c,#d0793c)}
.foot{display:flex;justify-content:center;gap:8px}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tile);color:var(--ink);padding:10px 14px;border-radius:12px;font:600 .9rem var(--display);z-index:60;max-width:calc(100% - 40px);box-shadow:0 6px 18px rgba(0,0,0,.35);text-align:center}

/* notebook */
.sheet{position:fixed;inset:0;background:rgba(6,20,17,.78);display:grid;place-items:center;z-index:40;padding:18px}
.paper{background:#f7f0dc;color:#2a2620;border-radius:6px;width:min(100%,380px);max-height:86vh;overflow:auto;padding:22px 20px 18px;box-shadow:0 18px 40px rgba(0,0,0,.5);
  background-image:repeating-linear-gradient(#f7f0dc 0 27px,#d9e3ea 27px 28px);display:flex;flex-direction:column;gap:10px}
.paper .date{font:600 .75rem var(--body);letter-spacing:.08em;text-transform:uppercase;color:#8a6a4a}
.paper h3{font:700 1.3rem var(--display);margin:0;color:#2a2620}
.paper .hand{font:600 1.35rem/28px var(--hand);white-space:pre-line;color:#203a6a}
.paper .note{font-size:.88rem;line-height:1.45;color:#4b4339}
.paper .btn{align-self:flex-end}
.pages{display:flex;flex-direction:column;gap:6px}
.pages button{text-align:left;background:rgba(255,255,255,.6);border:1px solid #d8cdb2;border-radius:8px;padding:9px 10px;font:600 .95rem var(--display);color:#2a2620;cursor:pointer}
.pages button span{display:block;font:500 .75rem var(--body);color:#8a6a4a}
.pages .locked{opacity:.45;cursor:default}
.danger{background:transparent;border:0;color:#a0442a;font:700 .8rem var(--body);cursor:pointer;align-self:flex-start;padding:4px 0}
@media (prefers-reduced-motion:reduce){.item.pop,.item.spawn,.item.hint{animation:none}.order{transition:none}}

/* compact layout: keep the whole board on screen */
.app{gap:7px}
.top h1{font-size:1.12rem}
.chip{padding:5px 9px;font-size:.84rem}
.bookchip{border:0;color:var(--cream);cursor:pointer;background:var(--copper);color:var(--ink)}
.scenebox .photo{aspect-ratio:auto;height:clamp(92px,17dvh,190px)}
.repair{padding:7px 11px;gap:8px}
.repair .lbl{font-size:.62rem}
.repair .name{font-size:.92rem}
.repair .btn{padding:7px 11px;font-size:.88rem}
.speech{font-size:.82rem;line-height:1.3;padding:7px 11px;min-height:0;height:calc(2.6em + 14px);box-sizing:border-box;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.speech:after{display:none}
.order{padding:6px;gap:5px}
.av{width:24px;height:24px;font-size:.64rem}
.who .n{font-size:.76rem}
.need{width:32px;height:32px}
.order .btn{padding:5px 6px;font-size:.8rem}
.boardwrap{padding:6px}
.board{margin:0 auto}
.under{padding-top:5px}
.info{font-size:.76rem}
.sell{height:38px}

/* compact v2 */
.scenewrap{position:relative}
.scenebox .photo{height:clamp(84px,14dvh,170px)}
.scenewrap .speech{position:absolute;left:8px;right:8px;top:8px;height:auto;max-height:calc(100% - 16px);z-index:2;opacity:0;transform:translateY(-6px);transition:opacity .3s,transform .3s;pointer-events:none;box-shadow:0 4px 12px rgba(0,0,0,.35)}
.scenewrap .speech.show{opacity:.97;transform:none}
.repair{padding:6px 10px}
.rline{display:flex;align-items:baseline;gap:7px;min-width:0;white-space:nowrap;overflow:hidden}
.rline .lbl{flex:none}
.rline .name{overflow:hidden;text-overflow:ellipsis;min-width:0}
.bar{margin-top:4px;height:5px}
.needs{align-items:center;flex-wrap:nowrap}
.needs .av{margin-right:2px}
.order{gap:5px}
@media (prefers-reduced-motion:reduce){.scenewrap .speech{transition:none}}

/* scene as hero: full image with HUD + repair laid over it */
.scene{position:relative}
.scenebox .photo{height:auto;aspect-ratio:16/9}
.hud{position:absolute;top:0;left:0;right:0;z-index:3;padding:8px 10px 18px;background:linear-gradient(rgba(9,26,22,.88),rgba(9,26,22,.55) 60%,rgba(9,26,22,0))}
.hud h1{text-shadow:0 2px 6px rgba(0,0,0,.6)}
.hud .chip{background:rgba(16,48,42,.82);backdrop-filter:blur(2px)}
.hud .bookchip{background:var(--copper)}
.scene .repair{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:18px 10px 8px;background:linear-gradient(rgba(9,26,22,0),rgba(9,26,22,.82) 45%,rgba(9,26,22,.92))}
.scene .repair .name{text-shadow:0 1px 4px rgba(0,0,0,.6)}
.scenewrap .speech{top:auto;bottom:62px}
#scene>svg{display:block;width:100%;height:auto}

/* lighter overlays so the shop stays visible */
.hud{padding:8px 10px 6px;background:linear-gradient(rgba(9,26,22,.6),rgba(9,26,22,0))}
.scene .repair{padding:6px 8px;background:none}
.scene .repair .txt{background:rgba(9,26,22,.74);border-radius:10px;padding:5px 9px;backdrop-filter:blur(2px)}
.boardwrap{position:relative}
.boardwrap .speech{position:absolute;left:10px;right:10px;top:10px;height:auto;z-index:4;opacity:0;transform:translateY(-6px);transition:opacity .3s,transform .3s;pointer-events:none;box-shadow:0 6px 16px rgba(0,0,0,.4)}
.boardwrap .speech.show{opacity:.97;transform:none}

@media (max-width:440px){.hud h1{display:none}}
.hud{gap:6px}

/* v3: customers in the scene, two-tier tasks */
.lvl{flex:1;min-width:0;background:rgba(16,48,42,.84);border-radius:999px;padding:4px 10px 5px;font:700 .7rem/1.15 var(--display);color:var(--cream);display:flex;flex-direction:column;gap:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvl i{display:block;height:4px;border-radius:3px;background:rgba(246,240,227,.2);overflow:hidden}
.lvl b{display:block;height:100%;width:0;background:#ffd166;border-radius:3px;transition:width .5s}
.starI{color:#ffd166}
.scene .repair{position:static;padding:7px 10px;background:none}
.scene .repair .txt{background:none;padding:0;backdrop-filter:none}
.scene .repair .btn{white-space:nowrap}
.custs{position:absolute;left:6px;right:6px;bottom:6px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;z-index:2;pointer-events:none}
.cust{pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;min-width:0;transition:opacity .3s,transform .3s;-webkit-tap-highlight-color:transparent}
.cust.leaving{opacity:0;transform:translateY(10px)}
.bub{background:rgba(251,244,228,.96);border-radius:12px;padding:3px 6px;display:flex;align-items:center;gap:3px;box-shadow:0 3px 9px rgba(0,0,0,.4);position:relative;border:2px solid transparent;max-width:100%}
.bub:after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-6px;border:6px solid transparent;border-top-color:rgba(251,244,228,.96)}
.bub .need{width:27px;height:27px;border-radius:7px}
.bub .st{font:700 .72rem var(--display);color:#6b4a1c;white-space:nowrap;padding-left:1px}
.cust.ready .bub{border-color:var(--turq);background:#f2fbf7;animation:bob 1.1s ease-in-out infinite}
.cust.ready .bub .st{color:#0f6b5b}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.pface{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font:700 .86rem var(--display);color:var(--ink);box-shadow:0 0 0 3px rgba(251,244,228,.92),0 5px 12px rgba(0,0,0,.45);overflow:hidden}
.pface img{width:100%;height:100%;object-fit:cover}
.fx{position:absolute;inset:0;z-index:6;pointer-events:all;display:grid;place-items:center;overflow:hidden}
.fxcard{background:rgba(251,244,228,.97);color:#2a2620;border-radius:14px;padding:9px 14px;text-align:center;box-shadow:0 8px 22px rgba(0,0,0,.45);animation:cardIn .5s cubic-bezier(.2,1.4,.4,1) both;display:flex;flex-direction:column;gap:2px;max-width:85%}
.fxcard b{font:700 1rem var(--display);color:#0f6b5b}
.fxcard span{font:700 .8rem var(--body);color:#8a5a1c}
.fxcard.big b{font-size:1.35rem;color:#b5561c}
@keyframes cardIn{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
.spark{position:absolute;left:50%;top:50%;width:9px;height:9px;margin:-4px;border-radius:50%;background:#ffd166;box-shadow:0 0 8px #ffd166;animation:spark .9s ease-out forwards}
@keyframes spark{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
.fx-old{position:absolute;inset:0;animation:fadeOld 1.6s .5s ease-in-out forwards}
@keyframes fadeOld{to{opacity:0}}
.fx-flash{position:absolute;inset:0;background:radial-gradient(circle,rgba(255,224,150,.8),rgba(255,224,150,0) 70%);animation:flash 1.6s .4s ease-out both}
@keyframes flash{0%{opacity:0}35%{opacity:1}100%{opacity:0}}
.conf{position:absolute;top:-12px;width:7px;height:11px;border-radius:2px;animation:conf 2.2s ease-in forwards}
@keyframes conf{to{transform:translateY(260px) rotate(540deg);opacity:.2}}
.item.box{background:linear-gradient(#ffe7a8,#e5a53c)}
@media (prefers-reduced-motion:reduce){.cust.ready .bub{animation:none}}

/* v4: bright checkered board with large items */
.boardwrap{background:#f4f0e4;padding:6px;border-radius:16px;box-shadow:inset 0 0 0 3px #d9cfb4}
.board{gap:0;border-radius:10px;overflow:hidden}
.cell{border-radius:0;background:#efe9d8;box-shadow:none}
.cell.alt{background:#e4ddc8}
.cell.target{background:#bfe8dc}
.item{width:100%;height:100%;border-radius:0;background:none!important;box-shadow:none}
.item img{width:96%;height:96%;filter:drop-shadow(0 3px 2px rgba(60,40,20,.28))}
.item svg{width:90%;height:90%;filter:drop-shadow(0 2px 2px rgba(60,40,20,.22))}
.item .lv{right:2px;bottom:1px;min-width:13px;height:13px;border-radius:7px;background:rgba(40,30,20,.62);color:#fff;font:700 .58rem/13px var(--display);text-align:center;opacity:1;padding:0 2px}
.item.gen{background:radial-gradient(circle,rgba(255,206,120,.75) 0,rgba(255,206,120,.25) 55%,rgba(255,206,120,0) 72%)!important;box-shadow:none}
.item.box{background:radial-gradient(circle,rgba(255,230,140,.9) 0,rgba(255,230,140,0) 70%)!important}
.item.sel{outline:3px solid var(--turq);outline-offset:-3px;border-radius:8px}
.dragghost{background:none!important;box-shadow:none;width:64px;height:64px}
.dragghost img,.dragghost svg{filter:drop-shadow(0 8px 8px rgba(0,0,0,.35))}
.under .info{color:#6b5a3e}
.under .info b{color:#2a2620}
.sell{border-color:#c9bc98;color:#8a7650}
.sell.target{border-color:var(--copper);color:#2a2620;background:rgba(208,121,60,.18)}
.bub{padding:4px 6px 4px 5px;gap:4px;border-radius:13px}
.bub .need{width:38px;height:38px;border-radius:9px;background:none!important}
.bub .need img{width:100%;height:100%}
.bub .need.ok:after{right:-3px;bottom:-3px}
.bub .st{position:absolute;top:-9px;right:-7px;background:#2a2620;color:#ffd166;border-radius:9px;padding:1px 6px;font:700 .66rem/1.4 var(--display);box-shadow:0 2px 5px rgba(0,0,0,.3)}
.cust.ready .bub .st{background:var(--turq);color:#08302a}
.pface{width:38px;height:38px}
.signin{animation:signIn .9s cubic-bezier(.2,1.4,.4,1) both}
@keyframes signIn{0%{transform:translateY(-30px);opacity:0}100%{transform:none;opacity:1}}

/* per-task scene changes */
.fxnew{animation:newIn .9s cubic-bezier(.2,1.5,.4,1) both}
@keyframes newIn{0%{opacity:0;transform:scale(.2)}70%{opacity:1;transform:scale(1.15)}100%{transform:scale(1)}}
.fxgone{animation:goneOut 1.1s ease-in forwards}
@keyframes goneOut{0%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
.smoke{animation:smoke 3.3s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes smoke{0%{transform:translate(0,30px) scale(.5);opacity:0}20%{opacity:.6}100%{transform:translate(46px,-20px) scale(1.5);opacity:0}}
.fx.small{align-items:end;padding-bottom:14px;pointer-events:none}
.sparkat{position:absolute;left:50%;top:50%;width:0;height:0}
@media (prefers-reduced-motion:reduce){.smoke{animation:none;opacity:.4}}

/* HUD as its own slim row so the roof stays visible */
.hud{position:static;background:none;padding:0;z-index:auto}
.hud .chip{background:var(--panel)}
.lvl{background:var(--panel)}

/* portraits */
.pface{width:44px;height:44px;background:#f6efe2!important}
.phead{display:flex;align-items:center;gap:10px}
.phead img{width:54px;height:54px;border-radius:50%;box-shadow:0 0 0 3px #e9dcc0,0 3px 8px rgba(0,0,0,.25);flex:none}
.pwho{font:600 .78rem var(--body);color:#8a6a4a}
.sface{width:24px;height:24px;border-radius:50%;vertical-align:-7px;margin-right:6px;box-shadow:0 0 0 2px #fff}

.hud .chip.bookchip{background:var(--copper);color:var(--ink)}

/* ===== v6: two screens ===== */
.screen{display:flex;flex-direction:column;gap:8px}
.homescr .scenewrap{border-radius:18px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.homescr .scenebox{aspect-ratio:700/717;width:100%}
.homescr .scenebox .over{position:absolute;inset:0;width:100%;height:100%}
.taskdock{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:center;z-index:3;pointer-events:none}
.taskbtn{pointer-events:auto;position:relative;width:84px;height:84px;border-radius:50%;border:0;cursor:pointer;background:radial-gradient(circle at 35% 30%,#3a5a7a,#1c2f45);box-shadow:0 0 0 5px rgba(251,244,228,.95),0 8px 18px rgba(0,0,0,.45);display:grid;place-items:center;padding:0}
.taskbtn .tico{width:54px;height:54px;display:block}
.taskbtn .tico svg{width:100%;height:100%}
.taskbtn .tcost{position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);background:#fbf4e4;color:#b5561c;border-radius:999px;padding:2px 12px;font:800 1rem var(--display);box-shadow:0 3px 8px rgba(0,0,0,.35);white-space:nowrap}
.taskbtn.can{animation:bobT 1.4s ease-in-out infinite;background:radial-gradient(circle at 35% 30%,#e9a26a,#b8692c)}
.taskbtn.can .tcost{color:#0f6b5b}
.taskbtn.letter{background:radial-gradient(circle at 35% 30%,#d65a4a,#8e2b1f)}
@keyframes bobT{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.taskcard{background:var(--panel);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.taskcard .rline{display:flex;gap:8px;align-items:baseline}
.taskcard .lbl{font:800 .66rem var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.taskcard .name{font:600 1.02rem var(--display)}
.tnote{font-size:.78rem;color:var(--muted)}
.gobtn{border:0;border-radius:16px;padding:12px 16px;cursor:pointer;background:linear-gradient(#5fd08a,#2f9e5c);color:#08301a;display:flex;flex-direction:column;align-items:center;gap:1px;box-shadow:0 4px 0 #1f6e3f,0 8px 16px rgba(0,0,0,.3);font-family:var(--display)}
.gobtn span{font:800 1.15rem var(--display)}
.gobtn small{font:700 .74rem var(--body);opacity:.85}
.gobtn.pulse{animation:pulseG 1.6s ease-in-out infinite}
@keyframes pulseG{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
.gobtn.back{background:linear-gradient(#f0b27a,#c8743a);color:#2a1a10;box-shadow:0 4px 0 #8e4a1c,0 8px 16px rgba(0,0,0,.3)}
.gobtn.back.ready{background:linear-gradient(#ffe08a,#e8a93a);animation:pulseG 1.2s ease-in-out infinite}
/* board screen: bright, lively */
.custhead{position:relative;border-radius:18px;padding:12px 8px 10px;background:
  radial-gradient(60px 26px at 18% 22%,rgba(255,255,255,.85),transparent 70%),
  radial-gradient(80px 30px at 72% 16%,rgba(255,255,255,.8),transparent 70%),
  linear-gradient(#7cc9ec,#c6ecf6 62%,#f6e7c4);overflow:hidden;box-shadow:inset 0 -3px 0 rgba(0,0,0,.06)}
.custhead:after{content:"";position:absolute;left:0;right:0;bottom:0;height:22px;background:repeating-linear-gradient(90deg,#d9b98a 0 18px,#cfae7d 18px 36px);opacity:.9}
.custhead .custs{position:relative;left:auto;right:auto;bottom:auto;z-index:1;pointer-events:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;align-items:end}
.custhead .cust{gap:6px}
.custhead .bub{background:#fffaf0;border-color:#f1e3c4;box-shadow:0 4px 10px rgba(60,40,10,.25)}
.custhead .bub:after{border-top-color:#fffaf0}
.custhead .bub .need{width:42px;height:42px}
.custhead .pface{width:66px;height:66px;box-shadow:0 0 0 4px #fffaf0,0 6px 14px rgba(40,30,10,.35);animation:idle 3.4s ease-in-out infinite}
.custhead .cust:nth-child(2) .pface{animation-delay:-1.1s}.custhead .cust:nth-child(3) .pface{animation-delay:-2.2s}
@keyframes idle{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-3px) rotate(-1.5deg)}}
.custhead .cust.ready .pface{box-shadow:0 0 0 4px var(--turq),0 0 18px rgba(69,193,168,.8)}
.boardscr .boardwrap{background:#e9f5f1;box-shadow:inset 0 0 0 3px #cfe6dd}
.boardscr .cell{background:#f3faf7}.boardscr .cell.alt{background:#e2f0ea}
.item.gen img,.item.gen svg{animation:genGlow 2.6s ease-in-out infinite}
@keyframes genGlow{0%,100%{filter:drop-shadow(0 3px 2px rgba(60,40,20,.28))}50%{filter:drop-shadow(0 0 6px rgba(255,200,90,.9))}}
/* dialogue */
.dlg{position:fixed;inset:0;z-index:70;background:linear-gradient(rgba(10,20,30,.25),rgba(10,20,30,.78));display:flex;align-items:flex-end;justify-content:center;padding:0 max(14px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-right,0px));cursor:pointer}
.dlgin{width:min(100%,440px)}
.dlgline{display:flex;align-items:flex-end;gap:10px;animation:cardIn .4s cubic-bezier(.2,1.4,.4,1) both}
.dlgline.r{flex-direction:row-reverse}
.dlgface{width:118px;height:118px;flex:none;border-radius:50%;overflow:hidden;box-shadow:0 0 0 5px #fbf4e4,0 10px 24px rgba(0,0,0,.5);background:#f6efe2;display:grid;place-items:center;font:700 1.6rem var(--display);color:var(--ink)}
.dlgface img{width:100%;height:100%;object-fit:cover}
.dlgbub{background:#fbf4e4;color:#2a2620;border-radius:18px;padding:12px 14px 10px;box-shadow:0 8px 22px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:4px;min-width:0;margin-bottom:28px}
.dlgbub b{font:700 1rem var(--display);color:#b5561c}
.dlgbub p{margin:0;font-size:.95rem;line-height:1.4}
.dlgnext{align-self:flex-end;font:700 .78rem var(--display);color:#0f6b5b}
/* board screen fills the phone: bigger faces, bigger items, items sit on the board */
.app.boardmode{padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
.boardscr .custhead{padding-top:calc(12px + var(--chx,0px)*.35);padding-bottom:calc(10px + var(--chx,0px)*.15)}
.boardscr .custhead .pface{width:var(--pf,66px);height:var(--pf,66px)}
.boardscr .custhead .bub .need{width:var(--nd,42px);height:var(--nd,42px)}
.boardscr .boardwrap{padding:5px}
.boardscr .gobtn.back{padding-block:calc(12px + var(--gbx,0px))}
.boardscr .item{overflow:visible}
.boardscr .item:before{content:"";position:absolute;left:16%;right:16%;bottom:7%;height:15%;border-radius:50%;background:radial-gradient(closest-side,rgba(70,55,30,.32),rgba(70,55,30,0));pointer-events:none}
.boardscr .item img{width:100%;height:100%;max-width:100%;object-fit:contain;transform:translateY(-3%);filter:none;position:relative}
.boardscr .item svg{width:94%;height:94%;transform:translateY(-3%);filter:none;position:relative}
.boardscr .cell{overflow:hidden}
.flyrew{position:absolute;transform:translateX(-50%);font:800 1.3rem var(--display);color:#ffd166;-webkit-text-stroke:1px #3b2414;text-shadow:0 2px 0 #3b2414;pointer-events:none;animation:flyup 1.1s ease-out forwards;z-index:5}
@keyframes flyup{0%{opacity:0;transform:translate(-50%,10px) scale(.7)}25%{opacity:1;transform:translate(-50%,-6px) scale(1.15)}100%{opacity:0;transform:translate(-50%,-50px) scale(1)}}
.boardscr .item.gen img,.boardscr .item.gen svg{animation:genGlow2 2.6s ease-in-out infinite}
@keyframes genGlow2{0%,100%{filter:none}50%{filter:drop-shadow(0 0 7px rgba(255,200,90,.95))}}
.boardscr .item .lv{z-index:2;right:1px;bottom:1px;min-width:12px;height:12px;font-size:.54rem;line-height:12px;background:rgba(40,30,20,.5)}
.boardscr .item.sel img,.boardscr .item.sel svg{transform:translateY(-6%) scale(1.04)}
@media (prefers-reduced-motion:reduce){.taskbtn.can,.gobtn.pulse,.gobtn.back.ready,.custhead .pface,.item.gen img,.item.gen svg{animation:none}}

.upnext{margin:2px 0 0;padding:8px 0 0;list-style:none;border-top:1px solid rgba(246,240,227,.12);display:flex;flex-direction:column;gap:5px}
.upnext li{font-size:.82rem;color:var(--muted);padding-left:16px;position:relative}
.upnext li:before{content:"";position:absolute;left:3px;top:.45em;width:7px;height:7px;border-radius:50%;border:2px solid var(--muted)}
.upnext li.lvlend{color:#ffd166}
.upnext li.lvlend:before{display:none}
.upnext li.lvlend{padding-left:0}
</style>

<body>
<div class="app" id="app">

  <div class="top hud">
    <h1>Dedemin Lokantası</h1>
    <div class="lvl" id="lvl" title="Dükkân seviyesi"><span id="lvlTxt">Dükkân</span><i><b id="lvlBar"></b></i></div>
    <div class="chip" title="Yıldız"><span class="starI">★</span><span id="stars">0</span></div>
    <div class="chip" title="Enerji"><span class="bolt">⚡</span><span id="energy">50</span><small id="etimer"></small></div>
    <button class="chip bookchip" id="bookBtn" type="button" aria-label="Defter">Defter</button>
  </div>
  <section class="screen homescr" id="homeScr">
    <div class="scenewrap" id="scenewrap"><div id="scene" class="scenebox" role="img" aria-label="Dükkânın ön cephesi"></div>
      <div class="taskdock">
        <button class="taskbtn" id="rBtn" type="button"><span class="tico" id="tIco"></span><span class="tcost" id="tCost">★10</span></button>
      </div>
    </div>
    <div class="taskcard">
      <div class="rline"><span class="lbl" id="rLbl">Görev</span><span class="name" id="rName"></span></div>
      <div class="bar"><i id="rBar"></i></div>
      <div class="tnote" id="tNote"></div>
      <ol class="upnext" id="upNext"></ol>
    </div>
    <button class="gobtn" id="goBoard" type="button"><span>Tahtaya git</span><small id="goBoardSub">Müşterilere servis yap, ★ topla</small></button>
  </section>

  <section class="screen boardscr" id="boardScr" hidden>
    <div class="custhead"><div class="custs" id="orders"></div></div>
    <section class="boardwrap">
      <div class="speech" id="speech" aria-live="polite"></div>
      <div class="board" id="board"></div>
      <div class="under"><div class="info" id="info">Tahtadaki bakır karelere dokun, malzeme çıksın.</div><div class="sell" id="sell">Sat</div></div>
    </section>
    <button class="gobtn back" id="goHome" type="button"><span>◂ Dükkân</span><small id="goHomeSub">Yıldızlarla dükkânı onar</small></button>
  </section>

</div>

<div class="dlg" id="dlg" hidden><div class="dlgin" id="dlgin"></div></div>
<div class="sheet" id="sheet" hidden><div class="paper" id="paper"></div></div>

// ---------- energy
function tickEnergy(){
  const now=Date.now();
  if(S.energy>=MAXE){S.eAt=now;}
  else{const g=Math.floor((now-S.eAt)/REGEN);if(g>0){S.energy=Math.min(MAXE,S.energy+g);S.eAt+=g*REGEN;if(S.energy>=MAXE)S.eAt=now;}}
  $("energy").textContent=S.energy;
  $("etimer").textContent=S.energy<MAXE?Math.ceil((REGEN-(now-S.eAt))/1000)+"sn":"";
}
setInterval(()=>{tickEnergy();},1000);

// ---------- orders
function newOrder(){
  const busy=S.orders.filter(Boolean).map(o=>o.p);
  const pool=chap().people.concat(S.chapter===2&&S.restored>=5?["halil"]:[]).concat(S.chapter===1&&S.restored>=2?["celile"]:[]).concat(((chap().city||{}).guests||[]).filter(g=>S.restored>=g[1]).map(g=>g[0]));
  const free=pool.filter(k=>!busy.includes(k));
  const p=pick(free), P0=PEOPLE[p];const lk0=P0.likes.filter(c=>CHAINS[S.chapter].includes(c));const P=Object.assign({},P0,{likes:lk0.length?lk0:CHAINS[S.chapter]});
  const C0=chap(), prog=C0.levels.slice(0,S.restored).reduce((a,L)=>a+L.tasks.length,0)+S.tdone;
  const cap=S.chapter===1?2+Math.floor(prog/4):3+Math.floor(prog/8);
  const minL=Math.min(3,S.chapter===1?1+Math.floor(prog/10):1+Math.floor(prog/12));
  const items=[];
  const count=P.pet?1:(Math.random()<Math.min(0.7,0.2+prog*0.02)?2:1);
  // smart order: sometimes ask for something already sitting on the board
  if(!P.pet&&Math.random()<0.5){
    const taken={};S.orders.filter(Boolean).forEach(o=>o.items.forEach(x=>{const k=x.c+x.l;taken[k]=(taken[k]||0)+1;}));
    const cand=[];S.board.forEach(x=>{if(x&&x.c&&!x.lk&&x.l>=Math.max(2,minL)&&P.likes.includes(x.c))cand.push(x);});
    const m=boardCounts();const free=cand.filter(x=>(m[x.c+x.l]||0)>(taken[x.c+x.l]||0));
    if(free.length){free.sort((a,b)=>b.l-a.l);const x=free[Math.floor(Math.random()*Math.min(3,free.length))];items.push({c:x.c,l:x.l});}
  }
  for(let k=items.length;k<count;k++){
    const c=pick(P.likes);
    const top=P.pet?2:Math.min(max(c),cap), lo=P.pet?1:Math.min(top,minL);
    let l=lo+Math.floor(Math.random()*(top-lo+1));
    if(!P.pet&&l<2&&Math.random()<0.7)l=Math.min(2,top);
    items.push({c,l});
  }
  return withReward({p,items},S.chapter);
}
function boardCounts(){const m={};S.board.forEach(x=>{if(x&&x.c&&!x.lk){const k=x.c+x.l;m[k]=(m[k]||0)+1;}});return m;}
function orderStatus(o){const m=boardCounts();const used={};return o.items.map(x=>{const k=x.c+x.l;used[k]=(used[k]||0)+1;return (m[k]||0)>=used[k];});}
function serve(i){
  const o=S.orders[i]; if(!orderStatus(o).every(Boolean)) return;
  o.items.forEach(x=>{const j=S.board.findIndex(y=>y&&!y.lk&&y.c===x.c&&y.l===x.l);if(j>-1)S.board[j]=null;});
  S.stars+=o.stars||0; S.served++;
  const P=PEOPLE[o.p];
  if(P.pet){S.energy=Math.min(MAXE,S.energy+(S.chapter>=2?8:6));}
  {const card0=document.querySelector(`.cust[data-i="${i}"]`);const host=document.querySelector(".custhead");if(card0&&host){const f=document.createElement("div");f.className="flyrew";f.textContent=P.pet?"+⚡":`+★${o.stars||0}`;const a=card0.getBoundingClientRect(),b=host.getBoundingClientRect();f.style.left=(a.left-b.left+a.width/2)+"px";f.style.top=(a.top-b.top+a.height*.45)+"px";host.appendChild(f);setTimeout(()=>f.remove(),1200);}}
  const card=document.querySelector(`.cust[data-i="${i}"]`); if(card)card.classList.add("leaving");
  S.orders[i]=null; save(); renderBoard(); renderTop(); renderRepair();
  setTimeout(()=>{S.orders[i]=newOrder();save();renderOrders();},window.__FAST?0:650);
}

function cellAt(x,y){const el=document.elementFromPoint(x,y);if(!el)return null;if(el.closest("#sell"))return "sell";const c=el.closest(".cell");return c?+c.dataset.i:null;}
function showInfo(i){
  const x=S.board[i]; if(!x){$("info").textContent="";return;}
  if(x.x){$("info").innerHTML=`<b>Ödül sandığı</b> · dokun, içinden malzemeler çıksın`;return;}
  if(x.g){$("info").innerHTML=`<b>${GEN_OF[x.g]}</b> · dokun, ${nm(x.g,1)} çıksın (1 ⚡)`;return;}
  if(x.lk){$("info").innerHTML=`<b>Tozlu ${nm(x.c,x.l)}</b> · Yerinden oynamaz. Aynısından birini üstüne getir, temizlenip birleşsin.`;return;}

function drop(from,to){
  const a=S.board[from];
  if(a.lk){toast("Tozlu eşya yerinden oynamaz. Aynısını üstüne getir!");return false;}
  if(to==="sell"&&(a.g||a.x)){toast(a.x?"Sandığı satamazsın, dokunup aç.":"Üreteçler satılamaz.");return false;}
  if(to==="sell"){const g=a.l>=2?Math.pow(2,a.l-2):0;S.energy+=g;S.board[from]=null;toast(g?`${nm(a.c,a.l)} satıldı: +${g} ⚡`:`${nm(a.c,a.l)} atıldı`);sel=-1;$("info").textContent="";}
  else if(to===null||to===from){return false;}
  else{
    const b=S.board[to];
    if(b&&b.lk&&!(a.c&&b.c===a.c&&b.l===a.l&&a.l<max(a.c))){toast("Tozlu eşyanın üstüne yalnızca aynısı konabilir.");return false;}
    if(!b){S.board[to]=a;S.board[from]=null;sel=to;}
    else if(a.c&&b.c&&b.c===a.c&&b.l===a.l&&a.l<max(a.c)){
      const nl=a.l+1;S.board[to]={c:a.c,l:nl};S.board[from]=null;fx[to]="pop";sel=to;
      const key=a.c+nl; if(b.lk)toast(`Tozlu ${nm(a.c,a.l)} temizlendi!`);if(!S.found[key]){S.found[key]=1;S.stars+=1;toast(`Yeni tarif: ${nm(a.c,nl)}! +1★`);}
    } else {S.board[to]=a;S.board[from]=b;sel=to;}
    showInfo(sel); sel=-1;
  }
  save(); renderBoard(); renderTop(); renderRepair(); return true;
}

  if(d.ghost)d.ghost.remove();
  if(d.moving){const t=cellAt(e.clientX,e.clientY);if(!drop(d.from,t))renderBoard();}
  else{ // tap: produce, select, or merge/move into a previously selected item
    if(S.board[d.from]&&S.board[d.from].x){openBox(d.from);return;}
    if(S.board[d.from]&&S.board[d.from].g){produce(d.from);return;}
    const A=S.board[sel], B=S.board[d.from];
    if(sel>-1&&sel!==d.from&&A&&A.c&&B&&B.c===A.c&&B.l===A.l&&A.l<max(A.c)&&!(A.lk&&B.lk)){if(A.lk)drop(d.from,sel);else drop(sel,d.from);}
    else{sel=d.from;showInfo(sel);renderBoard();}
  }
});
document.addEventListener("pointercancel",()=>{if(drag){if(drag.ghost)drag.ghost.remove();drag=null;renderBoard();}});
boardEl.addEventListener("click",e=>{ // tap empty cell to move selected item there
  if(e.target.closest(".item"))return; const c=e.target.closest(".cell");
  if(c&&sel>-1&&S.board[sel])drop(sel,+c.dataset.i);
});

// ---------- producers (on the board)
function produce(gi){
  tickEnergy();
  const c=S.board[gi].g;
  if(S.energy<1){toast("Enerjin bitti. Biraz bekle ya da kapıdaki dostunu doyur.");return;}
  const empty=[];S.board.forEach((x,i)=>{if(!x)empty.push(i);});
  if(!empty.length){toast("Tezgâh dolu! Birleştir ya da bir şey sat.");return;}
  const gx=gi%7, gy=Math.floor(gi/7); let best=Infinity, cands=[];
  empty.forEach(i=>{const d=Math.hypot(i%7-gx,Math.floor(i/7)-gy);
    if(d<best-1e-6){best=d;cands=[i];}else if(Math.abs(d-best)<1e-6)cands.push(i);});
  if(S.energy===MAXE)S.eAt=Date.now();
  S.energy--;
  const i=pick(cands);
  S.board[i]={c,l:Math.random()<0.12?2:1}; fx[i]="spawn"; fx[gi]="bump";
  showInfo(gi); save(); renderBoard(); tickEnergy();
}

function nearestEmpty(from){
  const fx0=from%7, fy0=Math.floor(from/7); let best=Infinity,bi=-1;
  S.board.forEach((x,i)=>{if(x)return;const d=Math.hypot(i%7-fx0,Math.floor(i/7)-fy0)+Math.random()*0.01;if(d<best){best=d;bi=i;}});
  return bi;
}
function placeItem(item,near){const i=nearestEmpty(near==null?24:near);if(i<0)return false;S.board[i]=item;fx[i]="spawn";return true;}
function openBox(i){
  S.board[i]=null;const ch=CHAINS[S.chapter];let n=0;
  for(let k=0;k<4;k++){if(placeItem({c:pick(ch),l:Math.random()<0.4?2:1},i))n++;}
  if(n<4)S.energy+=(4-n)*2;
  toast("Sandık açıldı!"); save(); renderBoard();
}

// ---------- repairs & scene
function renderTop(){
  $("stars").textContent=S.stars;tickEnergy();updateNav();
  const C=chap(),L=C.levels[S.restored];
  if(!L){$("lvlTxt").textContent=`${C.place} · tamamlandı`;$("lvlBar").style.width="100%";return;}
  const done=S.tdone*TASK_COST;
  $("lvlTxt").textContent=`Dükkân ${S.restored+1}/${C.levels.length} · ${done}/${L.need}`;

function renderRepair(){
  const C=chap(), L=C.levels[S.restored];
  if(!L){const more=S.chapter<MAXCH,nx=CHAPTERS[S.chapter+1];
    $("rLbl").textContent=more?`${S.chapter}. bölüm tamam`:"Hikâye tamamlandı";$("rName").textContent=more?`${nx.place} yolu açıldı`:"Annemizin defteri tamam";
    $("rBar").style.width="100%";$("upNext").innerHTML="";$("tIco").innerHTML=ICO.letter;$("tCost").textContent=more?"Yola çık":"Defter";$("rBtn").classList.add("can");$("rBtn").disabled=false;$("tNote").textContent=more?"Defterin son sayfası seni bekliyor":"Yeni sezon yakında";return;}
  $("rLbl").textContent=`Görev ${S.tdone+1}/${L.tasks.length}`;
  $("rName").textContent=L.tasks[S.tdone].n;
  $("rBar").style.width=Math.min(100,S.stars/TASK_COST*100)+"%";
  const isL=S.tdone===midTask(L)&&!!((DLG[S.chapter]||[])[S.restored]);
  $("upNext").innerHTML=L.tasks.slice(S.tdone+1,S.tdone+4).map((t,k)=>`<li>${S.tdone+1+k===midTask(L)&&(DLG[S.chapter]||[])[S.restored]?"✉ ":""}${t.n}</li>`).join("")+(S.tdone+4>=L.tasks.length?`<li class="lvlend">🎁 Seviye sonu: ödül sandığı + 25 ⚡</li>`:"");
  $("tIco").innerHTML=isL?ICO.letter:ICO.hammer;$("tCost").textContent=`★${TASK_COST}`;
  $("rBtn").classList.toggle("can",S.stars>=TASK_COST);$("rBtn").classList.toggle("letter",isL);
  $("rBtn").disabled=busy;
  $("tNote").textContent=isL?"Bu görevde hikâye ilerliyor ✉":(S.stars>=TASK_COST?"Çekice dokun, dükkân güzelleşsin":`★${TASK_COST} gerekli · elinde ★${S.stars}`);
}

function sparks(host,n){for(let k=0;k<n;k++){const sp=document.createElement("i");sp.className="spark";const a=Math.random()*6.283,d=50+Math.random()*90;

async function playBig(oldHtml,lvl){

    `<div class="fxcard big" style="animation-delay:1.1s"><b>Dükkân gelişti!</b><span>Seviye ${lvl} · +25 ⚡ ve ödül sandığı</span></div>`;

async function doTask(){
  const C=chap(),L=C.levels[S.restored];
  if(busy||!L)return;
  if(S.stars<TASK_COST){toast(`★${TASK_COST} gerekli. Tahtada müşterilere servis yap!`);document.getElementById("goBoard").classList.add("pulse");return;}
  busy=true;$("rBtn").disabled=true;
  S.stars-=TASK_COST;const T=L.tasks[S.tdone],name=T.n;S.tdone++;
  let rew;
  if(S.tdone%2){S.energy+=5;rew="+5 ⚡";}
  else{const c=pick(CHAINS[S.chapter]);rew=placeItem({c,l:2})?`Hediye: ${nm(c,2)}`:(S.energy+=5,"+5 ⚡");}
  save();renderTop();renderBoard();
  JUST=T.a||T.r||null;if(JUST)renderScene();
  await playSmall(name,rew,JUST?POS[JUST]:null);JUST=null;
  if(S.tdone-1===midTask(L)) await playDialog((DLG[S.chapter]||[])[S.restored]);
  if(S.tdone>=L.tasks.length){
    const old=$("scene").innerHTML;
    S.restored++;S.tdone=0;S.energy+=25;placeItem({x:"box"});save();
    renderScene();renderTop();renderRepair();
    await playBig(old,S.restored+1>C.levels.length?S.restored:S.restored+1);
    busy=false;renderAll();openPage(S.chapter,S.restored);return;
  }
  busy=false;renderRepair();renderTop();renderScene();
}

// ---------- orders render (customers stand in front of the shop)
function renderOrders(){
  const box=$("orders");
  box.innerHTML=S.orders.map((o,i)=>{
    if(!o)return `<div class="cust leaving" data-i="${i}"></div>`;
    if(o.stars==null)withReward(o,S.chapter);
    const P=PEOPLE[o.p], st=orderStatus(o), ok=st.every(Boolean);
    return `<div class="cust${ok?" ready":""}" data-i="${i}" role="button" tabindex="0" aria-label="${P.name}${ok?", hazır, vermek için dokun":""}">
      <div class="bub">${o.items.map((x,k)=>`<span class="need c-${x.c}${st[k]?" ok":""}" data-k="${x.c}${x.l}" title="${nm(x.c,x.l)}">${icon(x.c,x.l)}</span>`).join("")}<span class="st">${ok?"Ver ":""}${P.pet?"⚡":"★"+o.stars}</span></div>
      <div class="pface" style="background:${P.col}">${P.img?`<img src="${P.img}" alt="">`:P.init}</div>
    </div>`;}).join("");
}
$("orders").addEventListener("click",e=>{
  const c=e.target.closest(".cust"); if(!c||busy)return;
  const i=+c.dataset.i, o=S.orders[i]; if(!o)return;
  if(orderStatus(o).every(Boolean)){serve(i);return;}
  {const P=PEOPLE[o.p];P._a=((P._a||0)+1)%P.ask.length;say(o.p,P.ask[P._a]);}
  const names=o.items.map(x=>nm(x.c,x.l)).join(" ve ");$("info").innerHTML=`${PEOPLE[o.p].name} istiyor: <b>${names}</b>`;
});
$("orders").addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){const c=e.target.closest(".cust");if(c){e.preventDefault();c.click();}}});

function openPage(c,n){
  const p=CHAPTERS[c].pages[n];
  const first=n===0&&!seen(c);
  const go=c<MAXCH&&n===CHAPTERS[c].pages.length-1&&S.chapter===c&&S.restored>=CHAPTERS[c].levels.length;
  $("paper").innerHTML=`
    <div class="phead"><img src="${FACES[c===2?"halil":"dede"]}" alt=""><div><div class="date">${p.date}</div><div class="pwho">${CHAPTERS[c].book}</div></div></div>
    <h3>${p.title}</h3>
    ${p.note?`<div class="note">${p.note}</div>`:""}
    <div class="hand">${p.hand}</div>
    ${p.after?`<div class="note"><i>${p.after}</i></div>`:""}
    <button class="btn" type="button" id="closePage">${first?"Kepengi kaldır":go?`${TO[c+1]} yola çık`:"Defteri kapat"}</button>`;
  $("sheet").hidden=false;
  $("closePage").onclick=()=>{$("sheet").hidden=true;
    if(go){startChapter(c+1);return;}
    if(first){setSeen(c);save();
      if(c===1)say("nuri","Kepenk mi açılıyor? Yıllardır bu anı bekledim evladım!");
      else if(c===2)say("torun","Sen Mehmet Usta'nın torunu musun? Gel, dedemin dükkânını birlikte açalım.");
      else if(CHAPTERS[c].city)say(CHAPTERS[c].city.hello[0],CHAPTERS[c].city.hello[1]);}
    setTimeout(dailyCheck,600);};
}
function openBook(){
  let h="";
  for(let c=1;c<=S.chapter;c++){
    const C=CHAPTERS[c], unlocked=c<S.chapter?C.pages.length:S.restored+1;
    const body=`<div class="pages">${C.pages.map((p,i)=>i<unlocked
      ?`<button type="button" data-c="${c}" data-p="${i}">${p.title}<span>${p.date}</span></button>`
      :`<button type="button" class="locked" disabled>Kilitli sayfa<span>Dükkân seviye ${i} ile açılır</span></button>`).join("")}</div>`;
    const hd=`${c}. bölüm · ${C.place} · ${C.book}`;
    h=(c<S.chapter?`<details class="oldch"><summary class="date">${hd} ▸</summary>${body}</details>`:`<div class="date">${hd}</div>${body}`)+h;
  }
  let al="",tot=0,got=0;
  for(let c=1;c<=S.chapter;c++){al+=`<div class="album">`+CHAINS[c].map(ch=>CH[ch].items.map((it,i)=>{const k=ch+(i+1),ok=i===0||S.found[k];tot++;if(ok)got++;return `<i class="${ok?"":"no"}" title="${ok?it[1]:"?"}">${ok?ART[k]:"?"}</i>`;}).join("")).join("")+`</div>`;}
  h+=`<div class="date">Tarif albümü · ${got}/${tot} · her yeni tarif +1★</div>${al}`;
  $("paper").innerHTML=`<h3>Defterler</h3>${h}
    <div class="note">Hizmet verilen misafir: <b>${S.served}</b></div>
    <button class="danger" type="button" id="resetBtn">Baştan başla</button>
    <button class="btn" type="button" id="closeBook">Kapat</button>`;
  $("sheet").hidden=false;
  $("paper").querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>openPage(+b.dataset.c,+b.dataset.p));
  $("closeBook").onclick=()=>$("sheet").hidden=true;
  $("resetBtn").onclick=function(){
    if(this.dataset.armed){S=fresh();save();sel=-1;$("sheet").hidden=true;renderAll();openPage(1,0);}
    else{this.dataset.armed="1";this.textContent="Emin misin? Tüm ilerleme silinir. Tekrar dokun.";}
  };
}
$("bookBtn").addEventListener("click",openBook);
$("goBoard").addEventListener("click",()=>setView("board"));
$("goHome").addEventListener("click",()=>setView("home"));
$("sell").addEventListener("click",()=>{if(sel>-1&&S.board[sel])drop(sel,"sell");else toast("Satmak için önce bir eşyaya dokun ya da eşyayı buraya sürükle.");});
$("sheet").addEventListener("pointerdown",e=>{if(e.target.id==="sheet"&&seen(S.chapter))$("sheet").hidden=true;});

// ---------- fit the board to the visible screen
function fitBoard(){
  const bd=$("board"); if(!bd||$("boardScr").hidden)return;
  const root=$("boardScr");["--pf","--nd","--chx","--gbx"].forEach(k=>root.style.removeProperty(k));
  bd.style.maxWidth="";
  const standalone=(window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||navigator.standalone;
  const vh=(window.visualViewport?visualViewport.height:innerHeight);
  const reserve=standalone?10:(/iPhone|iPad/.test(navigator.userAgent)?70:10); // Safari floating bottom bar
  const top=bd.getBoundingClientRect().top+window.scrollY;
  const under=document.querySelector(".under"); const uh=under?under.getBoundingClientRect().height:40;
  const gh=$("goHome").getBoundingClientRect().height+8;
  const ios=/iPhone|iPad/.test(navigator.userAgent);const avail=Math.floor(vh-top-uh-(ios&&!standalone?0:gh)-reserve-14);
  const w=Math.max(300,Math.min(avail,bd.parentElement.clientWidth));
  bd.style.maxWidth=w+"px";
  // spare height left under the button: give it to bigger customers and a taller button
  const spare=Math.floor(vh-reserve-($("goHome").getBoundingClientRect().bottom+window.scrollY)-6);
  if(spare>8){const pf=Math.min(112,66+spare*.32),nd=Math.min(60,42+spare*.1);
    root.style.setProperty("--pf",pf+"px");root.style.setProperty("--nd",nd+"px");
    const used=(pf-66)+(nd-42);const rest=Math.max(0,spare-used);
    root.style.setProperty("--chx",Math.min(80,rest*.55)+"px");root.style.setProperty("--gbx",Math.min(8,rest*.1)+"px");}
}
window.addEventListener("resize",fitBoard);
if(window.visualViewport)visualViewport.addEventListener("resize",fitBoard);

// ---------- daily gift
const DAILY=[{e:15,t:"15 ⚡"},{e:20,t:"20 ⚡"},{s:5,t:"★5"},{e:25,t:"25 ⚡"},{s:8,t:"★8"},{e:30,t:"30 ⚡"},{s:10,box:1,t:"★10 + sandık"}];
const dayKey=t=>{const d=new Date(t);return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();};
function dailyCheck(){
  if(window.__FAST||!$("sheet").hidden||!seen(S.chapter))return;
  const today=dayKey(Date.now());S.daily=S.daily||{d:"",streak:0};if(S.daily.d===today)return;
  const st=(S.daily.d===dayKey(Date.now()-864e5)?S.daily.streak%7:0)+1, R=DAILY[st-1];
  $("paper").innerHTML=`<h3>Günlük hediye</h3><div class="note">Her gün uğra, hediyen büyüsün. ${st}. gün!</div>
    <div class="daily">${DAILY.map((x,i)=>`<div class="${i+1===st?"on":i+1<st?"got":""}">${i+1}. gün<b>${x.t}</b></div>`).join("")}</div>
    <button class="btn" type="button" id="takeDaily">Hediyeni al: ${R.t}</button>`;
  $("sheet").hidden=false;
  $("takeDaily").onclick=()=>{S.daily={d:today,streak:st};if(R.e)S.energy+=R.e;if(R.s)S.stars+=R.s;if(R.box&&!placeItem({x:"box"}))S.energy+=10;
    save();$("sheet").hidden=true;renderTop();renderRepair();renderBoard();toast(`Günlük hediye: ${R.t}`);};
}
// ---------- boot
function renderAll(){renderTop();renderRepair();renderScene();renderBoard();
}
for(let i=0;i<S.orders.length;i++){if(!S.orders[i])S.orders[i]=newOrder();}
{const seenP={};S.orders.forEach((o,i)=>{if(seenP[o.p]){S.orders[i]=null;S.orders[i]=newOrder();}seenP[S.orders[i].p]=1;});}
renderAll();
requestAnimationFrame(fitBoard);setTimeout(fitBoard,400);
const JUMP=KEY.endsWith("beta")?+(new URLSearchParams(location.search).get("bolum")||0):0;
if(JUMP>=2&&JUMP<=MAXCH){try{history.replaceState(null,"",location.pathname);}catch(e){}S.stars=Math.max(S.stars,20);startChapter(JUMP);}
else if(!seen(S.chapter)) openPage(S.chapter,0); else setTimeout(dailyCheck,900);
})();
</script>
